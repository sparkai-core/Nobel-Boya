# Render.com Blueprint Configuration for Storm Takeoff Platform
services:
  - type: web
    name: storm-takeoff
    env: docker
    dockerfilePath: Dockerfile
    plan: starter
    disk:
      name: storm-takeoff-data
      mountPath: /data
      sizeGB: 10
    envVars:
      - key: DATA_DIR
        value: /data
      - key: PORT
        value: "8090"
