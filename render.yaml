services:
  - type: web
    name: nobel-boq
    runtime: static
    buildCommand: cd app && npm ci --include=dev && npm run build
    staticPublishPath: app/dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NODE_VERSION
        value: "22"
    headers:
      - path: /sheets/*
        name: Cache-Control
        value: public, max-age=604800
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
